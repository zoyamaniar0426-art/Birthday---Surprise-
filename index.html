
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Little Magic For You 💙</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  overflow: hidden;
  background: radial-gradient(ellipse at bottom, #172b62 0%, #080d25 65%, #030612 100%);
  color: white;
  font-family: Georgia, serif;
}

.sky {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
}

.star {
  position: absolute;
  color: #b9d9ff;
  animation: twinkle 2s infinite alternate;
}

@keyframes twinkle {
  from { opacity: .2; transform: scale(.7); }
  to { opacity: 1; transform: scale(1.2); }
}

.butterfly {
  position: absolute;
  top: 22%;
  left: -100px;
  font-size: 58px;
  filter: drop-shadow(0 0 14px #399cff);
  animation: fly 12s ease-in-out infinite;
}

@keyframes fly {
  0%   { left: -90px; top: 20%; transform: rotate(-15deg); }
  25%  { left: 30%; top: 12%; transform: rotate(15deg); }
  50%  { left: 68%; top: 28%; transform: rotate(-12deg); }
  75%  { left: 35%; top: 36%; transform: rotate(12deg); }
  100% { left: 110%; top: 18%; transform: rotate(-10deg); }
}

main {
  position: relative;
  z-index: 2;
  min-height: 100vh;
  padding: 30px 22px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
}

.eyebrow {
  color: #9ecbff;
  letter-spacing: 4px;
  font-size: 11px;
  margin-bottom: 25px;
}

h1 {
  font-size: clamp(38px, 10vw, 58px);
  font-weight: normal;
  line-height: 1.2;
  margin: 12px 0;
  color: #f3f6ff;
  text-shadow: 0 0 25px #527fff;
}

p {
  color: #c3d4ff;
  line-height: 1.8;
  max-width: 340px;
  font-size: 16px;
}

button {
  margin-top: 25px;
  padding: 16px 25px;
  border: 1px solid #8dc6ff;
  border-radius: 40px;
  background: linear-gradient(135deg, #244b9b, #152653);
  color: white;
  font-size: 15px;
  box-shadow: 0 0 25px #315bc866;
  cursor: pointer;
}

button:active { transform: scale(.97); }

#next {
  display: none;
  animation: appear 1.5s ease;
}

@keyframes appear {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}

.heart { color: #9bcaff; font-size: 25px; }
.hint { font-size: 12px; color: #819bd7; margin-top: 35px; }
</style>
</head>
<body>

<div class="sky" id="sky">
  <div class="butterfly">🦋</div>
</div>

<main>
  <section id="welcome">
    <div class="eyebrow">✦ A LITTLE MAGIC FOR YOU ✦</div>
    <div class="heart">♡</div>
    <h1>Hey,<br>Birthday Boy...</h1>
    <p>
      Somewhere beneath a thousand stars,
      someone made a little world
      just for you. 💙
    </p>
    <button onclick="openSurprise()">
      Open Your Surprise ✨
    </button>
    <div class="hint">FOLLOW THE LITTLE BUTTERFLY 🦋</div>
  </section>

  <section id="next">
    <div class="heart">💙</div>
    <h1>Happy Birthday!</h1>
    <p>
      Today is all about you.
      And this is only the beginning
      of our little adventure...
    </p>
    <p>Made with love, just for you. ♡</p>
  </section>
</main>

<script>
const sky = document.getElementById("sky");

for (let i = 0; i < 65; i++) {
  const star = document.createElement("span");
  star.className = "star";
  star.textContent = "✦";
  star.style.left = Math.random() * 100 + "%";
  star.style.top = Math.random() * 100 + "%";
  star.style.fontSize = (5 + Math.random() * 9) + "px";
  star.style.animationDelay = Math.random() * 3 + "s";
  sky.appendChild(star);
}

function openSurprise() {
  document.getElementById("welcome").style.display = "none";
  document.getElementById("next").style.display = "block";
}
</script>

</body>
      </html>
